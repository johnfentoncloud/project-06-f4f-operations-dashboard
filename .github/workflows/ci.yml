name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Run frontend tests
        shell: bash
        run: |
          for test_file in frontend/tests/*.test.js; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Reject tracked generated artifacts
        shell: bash
        run: |
          tracked_artifacts="$(git ls-files | grep -E '(^|/)(\.terraform/|__pycache__/)|\.tfstate($|\.)|\.(tfplan|plan|pyc|pyo|zip)$' || true)"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Generated or sensitive build artifacts must not be tracked:"
            echo "$tracked_artifacts"
            exit 1
          fi

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run backend tests
        run: python -m unittest discover backend/tests -v

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate
